[package]
name = "nullgrav-boot"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nullgrav-vault = { path = "../vault-core" }
uefi = { version = "0.41.0", features = ["alloc", "global_allocator", "panic_handler", "logger"] }
sha2 = { version = "0.10.9", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
zune-jpeg = { version = "0.4.21", default-features = false }
zune-core = { version = "0.4.12", default-features = false }
zune-png = { version = "0.4.10", default-features = false }
