[workspace]
members = ["crates/vault-core", "crates/field-boot", "crates/fieldctl"]
default-members = ["crates/vault-core", "crates/fieldctl"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
